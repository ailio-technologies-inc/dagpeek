<!doctype html>
<!--
  The 1200x630 share image for dagpeek.com (site/public/og.png), in the site's colours and fonts with
  the README's real popover screenshot. Render it from the repo root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars \
    --force-color-profile=srgb --window-size=1200,630 --screenshot=site/public/og.png "file://$PWD/scripts/og-card.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
body { display: flex; color: #1d1d1f; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif; }
.text { display: flex; flex-direction: column; justify-content: center; width: 560px; padding: 0 0 0 72px; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.012em; }
h1 { margin-top: 40px; font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -0.022em; }
p { margin-top: 22px; font-size: 26px; line-height: 1.35; color: #424245; }
.small { margin-top: 30px; font-size: 21px; color: #6e6e73; }
.shot { display: flex; align-items: center; justify-content: center; flex: 1; margin: 28px 28px 28px 0; border-radius: 20px; background: #3d74ad; }
.shot img { display: block; width: 610px; height: auto; }
</style>
</head>
<body>
<div class="text">
  <div class="brand"><img src="../site/public/icon.png" alt="" width="52" height="52">Dagpeek</div>
  <h1>Dagu in your menu bar.</h1>
  <p>See what your Dagu server is running, what's queued and what failed.</p>
  <p class="small">Free for Mac and Windows. dagpeek.com</p>
</div>
<div class="shot"><img src="../docs/screenshot.png" alt=""></div>
</body>
</html>
